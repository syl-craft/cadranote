<div class="box" hidden></div>
<div class="tag" hidden></div>
<div id="attachment-highlights" aria-hidden="true"></div>
<section class="panel" role="dialog" aria-label="Cadranote">
  <header data-i18n-title="dragHeader">
    <span class="logo" aria-hidden="true"></span>
    <div>
      <h1>Cadranote</h1>
      <div class="subtitle" data-i18n="panelSubtitle"></div>
    </div>
    <button class="move" data-i18n-title="moveTitle" data-i18n-aria-label="moveLabel">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M12 4v16M8 8l4-4 4 4M8 16l4 4 4-4" />
      </svg>
    </button>
    <button class="close" data-i18n-title="closeTitle" data-i18n-aria-label="closeLabel">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </header>
  <div class="body">
    <div class="status" role="status"><span class="dot"></span><span id="status"></span></div>
    <p id="hint" class="hint"></p>
    <div id="result" hidden>
      <div class="primary-heading">
        <div class="label section-label">
          <span class="step">01</span> <span data-i18n="primaryHeading"></span>
        </div>
        <div class="meta" id="meta"></div>
      </div>
      <div class="label" id="selector-label"></div>
      <pre id="selector"></pre>
      <details>
        <summary data-i18n="pathSummary"></summary>
        <pre id="path"></pre>
        <pre id="html"></pre>
      </details>
      <details id="inspectors">
        <summary data-i18n="inspectorsSummary"></summary>
        <p class="action-help" data-i18n="inspectorsHelp"></p>
        <pre id="inspection" aria-live="polite"></pre>
      </details>
    </div>
    <div id="instruction-area">
      <label class="section-label" for="instruction"
        ><span class="step">02</span> <span data-i18n="requestLabel"></span>
        <span class="optional" data-i18n="optional"></span
      ></label>
      <textarea id="instruction" data-i18n-placeholder="requestPlaceholder"></textarea>
    </div>
    <section id="supplement-actions" hidden data-i18n-aria-label="supplementsLabel">
      <details id="attachments" hidden>
        <summary>
          <span class="step">03</span> <span data-i18n="supplementsLabel"></span>
          <span id="attachment-count"></span>
        </summary>
        <ul id="attachment-list" data-i18n-aria-label="supplementsLabel"></ul>
        <p id="empty-supplements" class="action-help" data-i18n="emptySupplements"></p>
        <div class="row">
          <button id="copy-all" data-i18n="copySupplements"></button
          ><button id="clear-all" data-i18n="clearSupplements"></button>
        </div>
      </details>
      <div class="row add-actions">
        <button id="attach">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 5v14M5 12h14" />
          </svg>
          <span data-i18n="addSupplement"></span>
        </button>
        <button id="cancel-add" hidden data-i18n="cancelSupplement"></button>
      </div>
    </section>
    <details id="principal-actions" hidden>
      <summary data-i18n="primaryTools"></summary>
      <div class="row">
        <button
          id="copy-content"
          data-i18n-title="copyContentTitle"
          data-i18n="copyContent"
        ></button
        ><button id="copy-html" data-i18n="copyHtml"></button>
      </div>
      <div class="row">
        <button id="copy-selector" data-i18n="copySelector"></button
        ><button id="parent" data-i18n="selectParent"></button>
      </div>
      <div class="row">
        <button id="restart" aria-describedby="restart-help" data-i18n="changeTarget"></button>
      </div>
      <p id="restart-help" class="action-help" data-i18n="changeTargetHelp"></p>
    </details>
  </div>
  <footer class="panel-footer">
    <button id="copy-ai" class="primary" hidden data-i18n-title="copyContextTitle">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="8" y="8" width="12" height="12" rx="2" />
        <path d="M16 8V4H4v12h4" />
      </svg>
      <span data-i18n="copyContext"></span>
    </button>
    <div class="feedback" role="status" aria-live="polite"></div>
    <div id="copy-fallback"></div>
    <div id="review" class="review" hidden>
      <span data-i18n="reviewQuestion"></span>
      <a id="review-open" target="_blank" rel="noopener noreferrer" data-i18n="reviewOpen"></a>
      <button id="review-later" class="link" data-i18n="reviewLater"></button>
      <button id="review-never" class="link" data-i18n="reviewNever"></button>
    </div>
    <div class="footer">
      <span data-i18n="localOnly"></span
      ><span><kbd data-i18n="escapeKey"></kbd> <span data-i18n="escapeToClose"></span></span>
    </div>
  </footer>
</section>
