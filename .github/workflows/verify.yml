name: Vérification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install chrome
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Cadranote
          path: Cadranote.zip
          if-no-files-found: error
